{% comment %}
Cartel de confirmación y de aviso con la estética de la app.

Confirmación: agregar al <form> el atributo data-confirmar="pregunta".
Opcionales: data-titulo, data-boton y data-tono ("rojo", "amarillo" o "verde").
Aviso sin pregunta: mostrarAviso('Título', 'Mensaje').
{% endcomment %}
<div id="modalConfirmar" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="modalConfirmarTitulo">
    <div class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 p-6 text-white text-left shadow-2xl">
        <div class="flex items-start justify-between gap-4">
            <div class="flex items-center gap-3">
                <div id="modalConfirmarIcono">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                </div>
                <div>
                    <h3 id="modalConfirmarTitulo" class="text-base font-bold text-white"></h3>
                    <p id="modalConfirmarTexto" class="mt-1 text-sm text-slate-300"></p>
                </div>
            </div>
            <button type="button" data-cerrar-confirmar class="text-slate-400 hover:text-white transition cursor-pointer" aria-label="Cerrar">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="mt-6 flex items-center justify-end gap-3">
            <button type="button" id="btnConfirmarCancelar" data-cerrar-confirmar
                class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold transition cursor-pointer">
                Cancelar
            </button>
            <button type="button" id="btnConfirmarAceptar"></button>
        </div>
    </div>
</div>
<script>
(() => {
    const TONOS = {
        rojo: { icono: 'bg-rose-500/15 border-rose-500/30 text-rose-400', boton: 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/20' },
        amarillo: { icono: 'bg-amber-500/15 border-amber-500/30 text-amber-400', boton: 'bg-amber-600 hover:bg-amber-500 shadow-amber-600/20' },
        verde: { icono: 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400', boton: 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/20' },
    };
    const $ = (id) => document.getElementById(id);
    const modal = $('modalConfirmar');
    let formularioPendiente = null;

    function abrir({ titulo, mensaje, boton, tono, soloAviso }) {
        const estilo = TONOS[tono] || TONOS.rojo;
        $('modalConfirmarIcono').className = `flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border ${estilo.icono}`;
        $('modalConfirmarTitulo').textContent = titulo;
        $('modalConfirmarTexto').textContent = mensaje;
        $('btnConfirmarAceptar').textContent = boton;
        $('btnConfirmarAceptar').className = `px-4 py-2 rounded-xl text-white text-xs font-semibold shadow-md transition cursor-pointer ${estilo.boton}`;
        $('btnConfirmarCancelar').classList.toggle('hidden', soloAviso);
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        // El foco queda en "Cancelar" para que un Enter apurado no confirme
        $(soloAviso ? 'btnConfirmarAceptar' : 'btnConfirmarCancelar').focus();
    }

    function cerrar() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        formularioPendiente = null;
    }

    window.mostrarAviso = (titulo, mensaje) => {
        formularioPendiente = null;
        abrir({ titulo, mensaje, boton: 'Entendido', tono: 'amarillo', soloAviso: true });
    };

    document.addEventListener('submit', (e) => {
        const form = e.target;
        if (!form.matches('form[data-confirmar]')) return;
        e.preventDefault();
        formularioPendiente = form;
        abrir({
            titulo: form.dataset.titulo || 'Confirmar acción',
            mensaje: form.dataset.confirmar,
            boton: form.dataset.boton || 'Confirmar',
            tono: form.dataset.tono || 'rojo',
            soloAviso: false,
        });
    });

    $('btnConfirmarAceptar').addEventListener('click', () => {
        const form = formularioPendiente;
        cerrar();
        if (form) form.submit();
    });
    modal.querySelectorAll('[data-cerrar-confirmar]').forEach((b) => b.addEventListener('click', cerrar));
    modal.addEventListener('click', (e) => { if (e.target === modal) cerrar(); });
    // Escape cierra solo este cartel, no la ventana que esté detrás
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
            e.stopImmediatePropagation();
            cerrar();
        }
    }, true);
})();
</script>
