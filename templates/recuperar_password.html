<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - GymTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


<body class="h-full flex items-center justify-center bg-slate-950 px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white tracking-tight">Recuperar contraseña</h2>
            <p class="text-xs text-slate-400 mt-2">
                Ingresá el correo asociado a tu cuenta para restablecer tu acceso.
            </p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">
                    Correo electrónico
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-xs">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="correo@ejemplo.com"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
                </div>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition duration-200 shadow-lg shadow-blue-600/30">
                Enviar instrucciones
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="text-xs text-slate-400 hover:text-slate-200 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver a iniciar sesión
            </a>
        </div>
    </div>
</body>
</html>
