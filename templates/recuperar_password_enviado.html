{% extends 'base.html' %}

{% block title %}Correo enviado{% endblock %}

{% block content %}
    <main class="flex-1 flex items-center justify-center px-4 py-12 w-full">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="w-14 h-14 bg-blue-600/10 border border-blue-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-blue-500 text-2xl shadow-inner">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-white tracking-tight">¡Correo enviado!</h2>
        <p class="text-xs text-slate-400 mt-3 leading-relaxed">
            Si la dirección ingresada coincide con una cuenta activa, recibirás un mensaje con las instrucciones para restablecer tu contraseña.
        </p>
        <div class="mt-8">
            <a href="{% url 'login' %}" 
                class="inline-block w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl text-xs transition duration-200 border border-slate-700">
                Volver al inicio de sesión
            </a>
        </div>
    </div>
    </main>
{% endblock %}
