<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - GymTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="h-full flex items-center justify-center bg-slate-950 px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="w-14 h-14 bg-emerald-600/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-emerald-400 text-2xl shadow-inner">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">¡Contraseña actualizada!</h2>
        <p class="text-xs text-slate-400 mt-3 leading-relaxed">Ya podés iniciar sesión con tu nueva contraseña.</p>
        <div class="mt-8">
            <a href="{% url 'login' %}"
                class="inline-block w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition duration-200">
                Iniciar sesión
            </a>
        </div>
    </div>
</body>
</html>
