{% extends 'base.html' %}

{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
    <main class="flex-1 flex items-center justify-center px-4 py-12 w-full">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="w-14 h-14 bg-emerald-600/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-emerald-400 text-2xl shadow-inner">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-white tracking-tight">¡Contraseña actualizada!</h2>
        <p class="text-xs text-slate-400 mt-3 leading-relaxed">Ya podés iniciar sesión con tu nueva contraseña.</p>
        <div class="mt-8">
            <a href="{% url 'login' %}"
                class="inline-block w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition duration-200">
                Iniciar sesión
            </a>
        </div>
    </div>
    </main>
{% endblock %}
